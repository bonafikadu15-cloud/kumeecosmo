<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kumee Cosmo Wholesale</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-slate-50 p-4">

    <!-- ADMIN CONSOLE (Visible only to you) -->
    <div id="admin-panel" class="hidden bg-slate-900 text-white p-4 rounded-xl mb-6 shadow-xl">
        <h2 class="text-amber-400 font-bold mb-2">🛠️ ADMIN: Product Editor</h2>
        <div class="grid grid-cols-2 gap-2">
            <input id="edit-name" placeholder="Name" class="text-black p-1 rounded">
            <input id="edit-price" placeholder="Price" type="number" class="text-black p-1 rounded">
            <button onclick="addProduct()" class="col-span-2 bg-emerald-600 p-2 rounded">Add/Update Product</button>
        </div>
    </div>

    <!-- CUSTOMER STOREFRONT -->
    <div id="storefront" class="space-y-4">
        <h1 class="text-2xl font-black text-emerald-950">✨ Kumee Cosmo</h1>
        <div id="product-list" class="grid gap-4"></div>
    </div>

    <script>
        // 1. Initialize data from storage or default
        let products = JSON.parse(localStorage.getItem('kumee_products')) || [
            { id: "p1", name: "Paraffin 500ml", price: 320 },
            { id: "p2", name: "Baby Jelly 400g", price: 350 }
        ];

        // 2. Render Products
        function renderStore() {
            const list = document.getElementById('product-list');
            list.innerHTML = "";
            products.forEach(p => {
                list.innerHTML += `
                    <div class="bg-white p-4 rounded-xl shadow flex justify-between items-center">
                        <div>
                            <p class="font-bold">${p.name}</p>
                            <p class="text-emerald-600 font-mono">${p.price} ETB</p>
                        </div>
                        <input type="number" class="w-16 border rounded text-center" placeholder="Qty">
                    </div>`;
            });
        }

        // 3. Admin Function to Add/Update
        function addProduct() {
            const name = document.getElementById('edit-name').value;
            const price = parseInt(document.getElementById('edit-price').value);
            if (!name || !price) return;

            const existing = products.find(p => p.name === name);
            if (existing) {
                existing.price = price;
            } else {
                products.push({ id: "p" + Date.now(), name, price });
            }

            localStorage.setItem('kumee_products', JSON.stringify(products));
            renderStore();
            alert("Updated for customers!");
        }

        // Check if Admin
        const tg = window.Telegram.WebApp;
        tg.ready();
        if (tg.initDataUnsafe.user?.id === 5966033751) {
            document.getElementById('admin-panel').classList.remove('hidden');
        }

        renderStore();
    </script>
</body>
</html>
