<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Kumee Cosmo — Premium TAFLEN Wholesale</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        html { scroll-behavior: smooth; }
        body { font-family: 'Inter', system-ui, sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased pb-24">

    <div id="admin-panel" class="hidden bg-slate-900 text-white p-4 border-b-4 border-amber-500 sticky top-0 z-50 shadow-xl">
        <div class="max-w-4xl mx-auto">
            <h2 class="text-[10px] font-black text-amber-400 uppercase tracking-widest mb-3">🛠️ Administrative Console</h2>
            <div id="admin-controls-grid" class="flex flex-wrap gap-2"></div>
        </div>
    </div>

    <header class="sticky top-0 z-40 glass border-b border-slate-200">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-lg font-extrabold text-emerald-950 tracking-tight">✨ KUMEE COSMO</h1>
                <p class="text-[9px] font-bold text-emerald-700 uppercase tracking-widest">Authorized Distributor</p>
            </div>
            <a href="#checkout-section" class="bg-emerald-600 text-white font-bold py-2 px-4 rounded-xl text-[11px] shadow-lg shadow-emerald-200 flex items-center gap-2">
                🛒 <span id="header-cart-count">0 Items</span>
            </a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-6 space-y-8">
        
        <section id="catalog" class="space-y-8">
            <div class="space-y-4">
                <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest">TAFLEN Paraffin Series</h3>
                <div class="grid grid-cols-2 gap-3" id="catalog-grid">
                    <div id="card-p1" class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm" data-id="p1" data-name="Paraffin 500ml" data-price="320">
                        <h4 class="font-bold text-xs mb-1">Paraffin 500ml</h4>
                        <p class="text-[10px] text-emerald-600 font-bold mb-3">320 ETB</p>
                        <input type="number" min="0" value="0" oninput="handleQuantityChange(this)" class="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-center font-bold text-sm outline-none focus:border-emerald-500">
                    </div>
                    <div id="card-p2" class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm" data-id="p2" data-name="Paraffin 330ml" data-price="240">
                        <h4 class="font-bold text-xs mb-1">Paraffin 330ml</h4>
                        <p class="text-[10px] text-emerald-600 font-bold mb-3">240 ETB</p>
                        <input type="number" min="0" value="0" oninput="handleQuantityChange(this)" class="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-center font-bold text-sm outline-none focus:border-emerald-500">
                    </div>
                </div>
            </div>
        </section>

        <section id="checkout-section" class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100">
            <h2 class="text-xs font-black uppercase tracking-wider mb-4 text-slate-500">📋 Selected Manifest</h2>
            
            <div id="dynamic-cart-list" class="space-y-2 mb-4">
                <p class="text-center text-[11px] text-slate-400 italic py-4" id="empty-cart-message">No wholesale products chosen yet.</p>
            </div>

            <div class="space-y-3 pt-4 border-t border-slate-100">
                <input type="text" id="client-name" placeholder="Pharmacy Name" class="w-full text-xs p-3.5 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-emerald-500">
                <input type="tel" id="client-phone" placeholder="Mobile Number" class="w-full text-xs p-3.5 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-emerald-500">
                <select id="payment-method" class="w-full text-xs p-3.5 bg-slate-50 border border-slate-200 rounded-xl">
                    <option>Cash on Delivery (COD)</option>
                    <option>Bank Transfer (CBE / Telebirr)</option>
                </select>
                <input type="file" id="receipt-upload" class="w-full text-[10px] p-2 file:bg-emerald-100 file:border-0 file:rounded-lg file:px-3 file:py-1">
            </div>

            <div class="flex justify-between items-center mt-6 pt-4 border-t border-slate-100">
                <span class="text-xs font-bold">Total:</span>
                <span id="invoice-grand-total" class="text-lg font-black text-emerald-600">0 ETB</span>
            </div>

            <button id="submit-order-btn" onclick="dispatchOrderDirectToTelegram()" class="w-full mt-4 bg-emerald-600 text-white font-bold py-4 rounded-xl active:scale-95 transition-transform uppercase text-[11px] tracking-widest">
                Submit Order
            </button>
        </section>
    </main>

    <script>
        const shoppingCart = {};
        const SECURE_TELEGRAM_BOT_TOKEN = "8902266701:AAHHD0jFSPhHoIAZnffPXxMRH90cUZT9URo";
        const DESTINATION_CHAT_ID = "5966033751";
        const MASTER_OWNER_ID = 5966033751;

        if (window.Telegram?.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        function handleQuantityChange(inputElement) {
            const container = inputElement.closest('[data-id]');
            const id = container.dataset.id;
            const qty = parseInt(inputElement.value) || 0;
            
            if (qty > 0) {
                shoppingCart[id] = { 
                    name: container.dataset.name, 
                    price: parseInt(container.dataset.price), 
                    qty: qty 
                };
            } else {
                delete shoppingCart[id];
            }
            updateUI();
        }

        function updateUI() {
            const list = document.getElementById('dynamic-cart-list');
            const emptyMsg = document.getElementById('empty-cart-message');
            let total = 0, items = 0;
            
            list.innerHTML = "";
            for (let id in shoppingCart) {
                let item = shoppingCart[id];
                total += (item.price * item.qty);
                items += item.qty;
                list.innerHTML += `<div class="flex justify-between text-[11px] bg-slate-50 p-2 rounded-lg font-bold"><span>${item.name} x ${item.qty}</span><span>${item.price * item.qty} ETB</span></div>`;
            }
            
            emptyMsg.style.display = items > 0 ? 'none' : 'block';
            document.getElementById('header-cart-count').innerText = `${items} Items`;
            document.getElementById('invoice-grand-total').innerText = `${total.toLocaleString()} ETB`;
        }

        async function dispatchOrderDirectToTelegram() {
            const btn = document.getElementById('submit-order-btn');
            const name = document.getElementById('client-name').value;
            
            if (!name) return alert("Please enter your pharmacy name.");
            
            btn.innerText = "Transmitting...";
            btn.disabled = true;

            let text = `📦 New Order: ${name}\nTotal: ${document.getElementById('invoice-grand-total').innerText}`;
            
            try {
                await fetch(`https://api.telegram.org/bot${SECURE_TELEGRAM_BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: DESTINATION_CHAT_ID, text: text })
                });
                alert("Order Sent!");
                window.location.reload();
            } catch (e) {
                alert("Transmission failed.");
                btn.disabled = false;
                btn.innerText = "Submit Order";
            }
        }
    </script>
</body>
</html>
